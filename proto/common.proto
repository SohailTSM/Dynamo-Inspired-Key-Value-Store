// Shared types. See docs/LLD.md §4.1.
syntax = "proto3";
package dkv.wire;

// node id -> counter. Code applies canonical (sorted-by-id) order whenever a clock is hashed or
// compared; protobuf map order is never relied on.
message VectorClock {
  map<string, uint64> entries = 1;
}

message Version {
  bytes       value          = 1;  // empty in metadata-only replies
  VectorClock clock          = 2;
  int64       timestamp_ms   = 3;  // coordinator wall clock; only a tie-break for concurrent versions
  string      coordinator_id = 4;
  bool        tombstone      = 5;  // reserved for a future DELETE
  bytes       digest         = 6;  // SHA-1(canonical clock | timestamp | coordinator | SHA-1(value))
}

enum Code {
  OK                 = 0;
  NOT_FOUND          = 1;
  QUORUM_NOT_REACHED = 2;
  INVALID_ARGUMENT   = 3;
  UNAVAILABLE        = 4;
  TIMEOUT            = 5;
  NOT_A_REPLICA      = 6;
  INTERNAL           = 7;
}

message Result {
  Code   code    = 1;
  string message = 2;
}

message Empty {}

// One record of the on-disk version log (payload of a [len][crc32c][payload] frame). LLD §6.2.
message LogRecord {
  uint32  type    = 1;  // 1 = PUT_VERSION (2 = DELETE, reserved)
  string  key     = 2;
  Version version = 3;
}
