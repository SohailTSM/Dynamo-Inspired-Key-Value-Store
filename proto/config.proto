// Cluster configuration, written as JSON and loaded with JsonStringToMessage. See docs/LLD.md §3.
syntax = "proto3";
package dkv.wire;
import "metadata.proto";

message Endpoint {
  string id   = 1;
  string host = 2;
  uint32 port = 3;
}

message Timing {
  uint32 heartbeat_interval_ms   = 1;  // default 1000
  uint32 suspect_after_missed    = 2;  // default 1
  uint32 down_after_missed       = 3;  // default 3
  uint32 detector_tick_ms        = 4;  // default 100
  uint32 coord_timeout_ms        = 5;  // default 500
  uint32 router_timeout_ms       = 6;  // default 1000
  uint32 anti_entropy_interval_s = 7;  // default 30
  uint32 ring_poll_interval_s    = 8;  // default 5
}

message Storage {
  string data_dir      = 1;  // default /tmp/${USER}/dynamo-kv ; ${USER} and ${ID} expanded
  uint64 segment_bytes = 2;  // default 64 MiB
}

message Policy {
  enum Resolution {
    LWW_ON_CONCURRENT = 0;
    RETURN_SIBLINGS   = 1;  // [P2]
  }
  enum Stamping {
    READ_BEFORE_WRITE = 0;
    LOCAL_ONLY        = 1;
  }
  Resolution resolution = 1;
  Stamping   stamping   = 2;
}

message ClusterConfig {
  string            cluster_name    = 1;
  repeated Endpoint storage_nodes   = 2;
  repeated Endpoint routers         = 3;
  Endpoint          metadata        = 4;
  Endpoint          admin           = 5;
  QuorumDefaults    quorum          = 6;
  uint32            vnodes_per_node = 7;
  Timing            timing          = 8;
  Storage           storage         = 9;
  Policy            policy          = 10;
}
