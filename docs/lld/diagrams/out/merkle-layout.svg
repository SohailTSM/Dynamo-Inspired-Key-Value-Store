<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1050px;height:535px;background:#FFFFFF;" width="1050px" height="535px" viewBox="0 0 1050 535" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="231.637" y="27.104" fill="#000" font-size="16" textLength="580.225" font-weight="700">Object Diagram — Merkle tree for one ring range (fan-out 16, 256 leaves)</text></g><g class="entity" data-qualified-name="root" id="ent0001" data-source-line="5"><rect x="385" y="54.792" width="190.087" height="47.412" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="441.005" y="70.689" fill="#000" font-size="13" textLength="78.078">root : node 0</text><line x1="386" y1="76.498" x2="574.087" y2="76.498" style="stroke:#181818;stroke-width:0.5;"/><text x="391" y="94.395" fill="#000" font-size="13" textLength="178.087">hash = SHA1(child1 .. child16)</text></g><g class="entity" data-qualified-name="i1" id="ent0002" data-source-line="8"><rect x="186" y="154.792" width="184.471" height="47.412" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="236.031" y="170.689" fill="#000" font-size="13" textLength="84.409">inner : node 1</text><line x1="187" y1="176.498" x2="369.471" y2="176.498" style="stroke:#181818;stroke-width:0.5;"/><text x="192" y="194.395" fill="#000" font-size="13" textLength="172.471">hash = SHA1(leaf17 .. leaf32)</text></g><g class="entity" data-qualified-name="i2" id="ent0003" data-source-line="11"><rect x="388" y="154.792" width="184.471" height="47.412" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="438.031" y="170.689" fill="#000" font-size="13" textLength="84.409">inner : node 2</text><line x1="389" y1="176.498" x2="571.471" y2="176.498" style="stroke:#181818;stroke-width:0.5;"/><text x="394" y="194.395" fill="#000" font-size="13" textLength="172.471">hash = SHA1(leaf33 .. leaf48)</text></g><g class="entity" data-qualified-name="i16" id="ent0004" data-source-line="14"><rect x="835.5" y="154.792" width="199.343" height="47.412" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="889.249" y="170.689" fill="#000" font-size="13" textLength="91.845">inner : node 16</text><line x1="836.5" y1="176.498" x2="1033.843" y2="176.498" style="stroke:#181818;stroke-width:0.5;"/><text x="841.5" y="194.395" fill="#000" font-size="13" textLength="187.343">hash = SHA1(leaf257 .. leaf272)</text></g><g class="entity" data-qualified-name="l17" id="ent0005" data-source-line="17"><rect x="42" y="254.792" width="246.013" height="65.118" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="92.304" y="270.689" fill="#000" font-size="13" textLength="145.405">leaf : node 17 (bucket 0)</text><line x1="43" y1="276.498" x2="287.013" y2="276.498" style="stroke:#181818;stroke-width:0.5;"/><text x="48" y="294.395" fill="#000" font-size="13" textLength="159.029">keys with SHA1(key)[0] = 0</text><text x="48" y="312.101" fill="#000" font-size="13" textLength="234.013">hash = SHA1(key || 0x00 || digests ...)</text></g><g class="entity" data-qualified-name="l18" id="ent0006" data-source-line="21"><rect x="306.5" y="263.792" width="171.029" height="47.412" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="319.312" y="279.689" fill="#000" font-size="13" textLength="145.405">leaf : node 18 (bucket 1)</text><line x1="307.5" y1="285.498" x2="476.529" y2="285.498" style="stroke:#181818;stroke-width:0.5;"/><text x="312.5" y="303.395" fill="#000" font-size="13" textLength="159.029">keys with SHA1(key)[0] = 1</text></g><g class="entity" data-qualified-name="l272" id="ent0007" data-source-line="24"><rect x="842" y="263.792" width="185.901" height="47.412" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="851.094" y="279.689" fill="#000" font-size="13" textLength="167.713">leaf : node 272 (bucket 255)</text><line x1="843" y1="285.498" x2="1026.901" y2="285.498" style="stroke:#181818;stroke-width:0.5;"/><text x="848" y="303.395" fill="#000" font-size="13" textLength="173.901">keys with SHA1(key)[0] = 255</text></g><g class="entity" data-qualified-name="e1" id="ent0008" data-source-line="27"><rect x="6" y="355.792" width="108.408" height="65.118" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="44.175" y="371.689" fill="#000" font-size="13" textLength="32.058">entry</text><line x1="7" y1="377.498" x2="113.408" y2="377.498" style="stroke:#181818;stroke-width:0.5;"/><text x="12" y="395.395" fill="#000" font-size="13" textLength="91.026">key = "user:42"</text><text x="12" y="413.101" fill="#000" font-size="13" textLength="96.408">digests = [d(v7)]</text></g><g class="entity" data-qualified-name="e2" id="ent0009" data-source-line="31"><rect x="132.5" y="355.792" width="276.797" height="65.118" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="254.87" y="371.689" fill="#000" font-size="13" textLength="32.058">entry</text><line x1="133.5" y1="377.498" x2="408.297" y2="377.498" style="stroke:#181818;stroke-width:0.5;"/><text x="138.5" y="395.395" fill="#000" font-size="13" textLength="91.026">key = "user:97"</text><text x="138.5" y="413.101" fill="#000" font-size="13" textLength="264.797">digests = [d(v3), d(v4)]  (concurrent siblings)</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="46"><path d="M590.5,141.792 L590.5,174.292 L572.313,178.292 L590.5,182.292 L590.5,214.616 A4,4 0 0 0 594.5,218.616 L813.602,218.616 A4,4 0 0 0 817.602,214.616 L817.602,147.792 L807.602,137.792 L594.5,137.792 A4,4 0 0 0 590.5,141.792" style="stroke:#C9A227;stroke-width:0.5;" fill="#FFF8E1"/><path d="M807.602,137.792 L807.602,145.792 A2,2 0 0 0 809.602,147.792 L817.602,147.792 L807.602,137.792" style="stroke:#C9A227;stroke-width:0.5;" fill="#FFF8E1"/><text x="596.5" y="156.689" fill="#000" font-size="13" textLength="105.82">heap numbering:</text><text x="596.5" y="174.395" fill="#000" font-size="13" textLength="202.449">children of node i (i = 0) are 1..16;</text><text x="596.5" y="192.101" fill="#000" font-size="13" textLength="206.102">children of inner node i (1..16) are</text><text x="596.5" y="209.807" fill="#000" font-size="13" textLength="142.064">17 + 16*(i-1) .. 16 + 16*i</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="53"><path d="M30,460.792 L30,515.91 A4,4 0 0 0 34,519.91 L508.344,519.91 A4,4 0 0 0 512.344,515.91 L512.344,466.792 L502.344,456.792 L275,456.792 L271,420.839 L267,456.792 L34,456.792 A4,4 0 0 0 30,460.792" style="stroke:#C9A227;stroke-width:0.5;" fill="#FFF8E1"/><path d="M502.344,456.792 L502.344,464.792 A2,2 0 0 0 504.344,466.792 L512.344,466.792 L502.344,456.792" style="stroke:#C9A227;stroke-width:0.5;" fill="#FFF8E1"/><text x="36" y="475.689" fill="#000" font-size="13" textLength="461.344">digest = SHA1(canonical clock || timestamp || coordinator || SHA1(value)),</text><text x="36" y="493.395" fill="#000" font-size="13" textLength="374.166">computed once by the coordinator, identical on every replica.</text><text x="36" y="511.101" fill="#000" font-size="13" textLength="437.021">A write marks its leaf and ancestors dirty; hashes are recomputed lazily.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-link-type="composition"><polygon points="433.403,101.898,426.259,100.918,422.607,107.136,429.751,108.116,433.403,101.898" fill="#37474F" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M422.607,107.136 C389.983,122.964 357.361,138.79 324.712,154.63" style="stroke:#37474F;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0